<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marty · WIDTH</title>
<meta name="description" content="Marty">
<style>
  :root{
    --bg:#f5f7fa; --surface:#ffffff; --ink:#141a24; --muted:#5b6675; --line:#e2e7ef;
    --accent:#1f5fff; --accent-ink:#0b3bb0;
    --sans:-apple-system,"SF Pro Display","Segoe UI",system-ui,"PingFang SC","Microsoft YaHei",sans-serif;
    --mono:"SF Mono",ui-monospace,Menlo,monospace;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#0b0e14; --surface:#141a24; --ink:#e7ecf4; --muted:#95a2b6; --line:#28323f;
    --accent:#5b8bff; --accent-ink:#a9c2ff;
  }}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:
     radial-gradient(1200px 600px at 70% -10%, color-mix(in srgb,var(--accent) 10%,transparent), transparent 60%),
     var(--bg);
    color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;
    display:flex;min-height:100%;align-items:center;justify-content:center;padding:32px}
  .card{width:100%;max-width:640px}
  .mark{display:inline-grid;place-items:center;width:56px;height:56px;border-radius:14px;
    background:var(--accent);color:#fff;font-weight:850;font-size:28px;letter-spacing:-.02em}
  .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin:26px 0 10px}
  h1{font-size:clamp(34px,7vw,56px);line-height:1.02;letter-spacing:-.03em;font-weight:850;margin:0}
  .role{font-size:clamp(16px,2.4vw,20px);color:var(--muted);margin:14px 0 0;line-height:1.5}
  .role b{color:var(--ink);font-weight:650}
  .lead{font-size:16px;color:var(--muted);line-height:1.6;margin:22px 0 0;max-width:52ch}
  .rule{height:1px;background:var(--line);margin:30px 0}
  .soon{display:inline-flex;align-items:center;gap:9px;font-family:var(--mono);font-size:13px;color:var(--muted);
    border:1px dashed var(--line);border-radius:999px;padding:8px 14px}
  .soon .d{width:8px;height:8px;border-radius:50%;background:var(--accent)}
  .foot{margin-top:30px;font-family:var(--mono);font-size:12px;color:var(--muted)}
  a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
</style>
</head>
<body>
  <main class="card">
    <span class="mark">M</span>
    <h1>Marty</h1>
    <p class="foot">github.com/mingdengdu</p>
  </main>
</body>
</html>
